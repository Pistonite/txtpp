[package]
name = "txtpp"
version = "0.3.0"
edition = "2024"
description = "A simple-to-use general purpose preprocessor for text files."
repository = "https://github.com/Pistonite/txtpp"
license = "GPL-3.0"
authors = ["Pistonight <pistonknight@outlook.com>"]
keywords = ["preprocessor", "tool", "template", "macro", "include"]
categories = ["development-tools::build-utils", "template-engine"]
exclude = [
    "tests/examples/**/*",
    "docs/*",
    ".github/**/*",
    "Taskfile.yml"
]

[dependencies.cu]
package = "pistonite-cu"
version = "0.8.2"
features = ["fs"]

[dependencies]
error-stack = { version = "0.5.0", features = ["anyhow"] }
termcolor = "1.4.1"
threadpool = "1.8.1"
clap = { version = "^4.4.7", features = ["cargo", "derive"] }
env_logger = "0.11.5"
derivative = "2.2.0"

[dev-dependencies]
copy_dir = "^0.1.2"
murmur3 = "^0.5.2"

[[bin]]
name = "txtpp"
path = "src/main.rs"

[lib]
name = "txtpp"
path = "src/lib.rs"
